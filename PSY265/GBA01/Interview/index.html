<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSG Screening Interview Tool</title>
<style>
  :root{
    --bg:#f6f5f1; --surface:#ffffff; --surface-2:#f0efe9; --border:#e0ddd3;
    --text:#211f1a; --text-dim:#6b6858; --accent:#2f6f52; --accent-ink:#ffffff;
    --accent-soft:#e4f1e9; --warn:#8a5a12; --warn-soft:#fbeed9; --danger:#a13b2f; --danger-soft:#fbe7e3;
    --s-attitude:#3d6ea5; --s-attitude-soft:#e4edf7;
    --s-norms:#7a4f9e; --s-norms-soft:#efe6f5;
    --s-pbc:#b07a1f; --s-pbc-soft:#f7edd9;
    --s-final:#2f6f52; --s-final-soft:#e4f1e9;
    --s-post:#a13b2f; --s-post-soft:#fbe7e3;
    --s-demo:#6b6858; --s-demo-soft:#eeece5;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#171613; --surface:#201f1b; --surface-2:#262420; --border:#3a382f;
      --text:#eeece4; --text-dim:#a6a396; --accent:#5fae86; --accent-ink:#0c1410;
      --accent-soft:#1d3227; --warn:#e0b25c; --warn-soft:#332a15; --danger:#e2887a; --danger-soft:#3a201c;
      --s-attitude:#7fb0e0; --s-attitude-soft:#1c2c3d;
      --s-norms:#c3a4e0; --s-norms-soft:#2b2236;
      --s-pbc:#e0b25c; --s-pbc-soft:#382c14;
      --s-final:#5fae86; --s-final-soft:#1d3227;
      --s-post:#e2887a; --s-post-soft:#3a201c;
      --s-demo:#a6a396; --s-demo-soft:#2a2822;
    }
  }
  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; margin:0; padding:20px 16px 80px;}
  .wrap{max-width:940px; margin:0 auto;}
  h1{font-size:1.25rem; margin:0 0 2px;}
  .sub{color:var(--text-dim); font-size:.85rem; margin:0 0 18px;}
  .layout{display:grid; grid-template-columns:200px 1fr; gap:18px;}
  @media (max-width:720px){ .layout{grid-template-columns:1fr;} }

  .card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px;}
  .sidebar .card{padding:10px;}
  .sess-item{display:flex; align-items:center; justify-content:space-between; padding:9px 8px; border-radius:8px; cursor:pointer; font-size:.88rem;}
  .sess-item:hover{background:var(--surface-2);}
  .sess-item.active{background:var(--accent-soft); color:var(--accent); font-weight:600;}
  .status-dot{width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px; background:var(--border);}
  .status-dot.has{background:var(--accent);}

  button{font:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); padding:9px 14px;}
  button:hover{background:var(--surface-2);}
  button.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  button.primary:hover{filter:brightness(1.05);}
  button.ghost{background:transparent; border-color:transparent; color:var(--text-dim); padding:6px 8px;}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}

  label{display:block; font-size:.78rem; color:var(--text-dim); margin:0 0 4px;}
  input[type=text], textarea{width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:9px 10px; font:inherit;}
  textarea{resize:vertical; min-height:56px;}
  .field{margin-bottom:12px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media (max-width:520px){ .grid2{grid-template-columns:1fr;} }

  .tag{display:inline-block; font-size:.68rem; font-weight:700; padding:2px 8px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em; margin-bottom:8px;}
  .tag.demo{background:var(--s-demo-soft); color:var(--s-demo);}
  .tag.attitude{background:var(--s-attitude-soft); color:var(--s-attitude);}
  .tag.norms{background:var(--s-norms-soft); color:var(--s-norms);}
  .tag.pbc{background:var(--s-pbc-soft); color:var(--s-pbc);}
  .tag.final{background:var(--s-final-soft); color:var(--s-final);}
  .tag.post{background:var(--s-post-soft); color:var(--s-post);}

  .qblock{border-bottom:1px solid var(--border); padding:14px 0;}
  .qblock:last-child{border-bottom:none;}
  .qnum{font-weight:600; font-size:.94rem; margin:0 0 8px;}

  h2{font-size:1rem; margin:0 0 4px;}
  h3{font-size:.78rem; margin:18px 0 4px; color:var(--text-dim); font-weight:700; text-transform:uppercase; letter-spacing:.03em;}
  .muted{color:var(--text-dim); font-size:.85rem;}
  .savebar{position:sticky; top:0; z-index:5; background:var(--bg); padding:8px 0 12px; margin-bottom:4px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;}
  .savestate{font-size:.8rem; color:var(--text-dim);}
  .savestate.ok{color:var(--accent);}
  .footerbar{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; border-top:1px solid var(--border); padding-top:16px;}
  #fileInput{display:none;}
  .banner{font-size:.82rem; padding:9px 12px; border-radius:8px; margin-bottom:14px; background:var(--warn-soft); color:var(--warn);}
</style>
</head>
<body>
<div class="wrap">
  <h1>HSG Screening Interview Tool</h1>
  <p class="sub">PSY265 GBA01 — type answers in live during the interview. Autosaves to this browser as you go; use "Export backup" regularly so you never lose data if the browser is cleared or you switch devices.</p>

  <div class="layout">
    <div class="sidebar">
      <div class="card">
        <h3 style="margin-top:0;">Interviewees</h3>
        <div id="sessList"></div>
        <button class="ghost" id="addSessBtn" style="width:100%; margin-top:6px; text-align:left;">+ Add interviewee</button>
      </div>
    </div>

    <div id="main"></div>
  </div>
</div>

<input type="file" id="fileInput" accept="application/json">

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "hsg-tpb-interview-data-v1";
  const IDS_DEFAULT = ["P1","P2","P3","P4","P5"];

  const QUESTIONS = [
    {n:2, section:"attitude", label:"Attitude towards checkups", text:"Is there a reason you have not gone for health screening in the past three years?"},
    {n:3, section:"attitude", label:"Attitude towards checkups", text:"Do you see any benefits of going for a health screening at this point in your life?"},
    {n:4, section:"attitude", label:"Attitude towards checkups", text:"Are there any concerns or downsides do you associate with screening (— for example discomfort, waiting for results, cost, or something else)? If yes, please elaborate."},
    {n:5, section:"attitude", label:"Attitude towards checkups", text:"Overall, would you say you feel positive, negative, or neutral about health screening? What makes you feel that way?"},
    {n:6, section:"norms", label:"Subjective norms", text:"Are there people in your life — family, friends, colleagues, or your doctor, who think you should go for screening? If yes, why you no go?"},
    {n:7, section:"norms", label:"Subjective norms", text:"Do you know people around your age who've gone for screening? Does knowing that affect how you think about it, one way or another?"},
    {n:8, section:"norms", label:"Subjective norms", text:"If someone important to you strongly wanted you to go for screening, would that change your decision? Why or why not?"},
    {n:9, section:"pbc", label:"Perceived behavioural control", text:"Have you ever tried or planned to book a screening before? What happened?"},
    {n:10, section:"pbc", label:"Perceived behavioural control", text:"How confident are you that you could get a screening done in the next 3 months if you decided to? What would make you more confident?"},
    {n:11, section:"final", label:"Final confirmation", text:"Thinking back over everything we've discussed, what's the single biggest reason you haven't gone for screening in the past three years?"},
    {n:12, section:"final", label:"Final confirmation", text:"What would motivate or encourage you to finally go — a person, a reminder, cost subsidy, convenience, something else?"},
    {n:13, section:"post", label:"Post question", text:"Just to check something — if you knew that a basic screening costs about $5 and takes around 15 minutes at [a nearby HSG clinic], would that change how you feel about it, or would your main concern still be there?"}
  ];
  const SECTION_LABEL = {demo:"Demographics", attitude:"Attitude towards checkups", norms:"Subjective norms", pbc:"Perceived behavioural control", final:"Final confirmation", post:"Post question"};

  let state = {};       // id -> {demographics:{}, answers:{n:text}}
  let activeId = null;
  let saveTimer = null;

  function newSession(){
    return { demographics:{age:"",gender:"",race:"",profession:"",education:""}, answers:{} };
  }

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) state = JSON.parse(raw);
    }catch(e){ state = {}; }
    IDS_DEFAULT.forEach(id => { if(!state[id]) state[id] = newSession(); });
  }

  function persist(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      setSaveState(true);
    }catch(e){
      setSaveState(false, "Couldn't autosave to this browser — export a backup now.");
    }
  }

  function scheduleSave(){
    setSaveState(null, "Saving…");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persist, 400);
  }

  function setSaveState(ok, msg){
    const el = document.getElementById("saveState");
    if(!el) return;
    if(ok === true){
      el.textContent = "Saved " + new Date().toLocaleTimeString();
      el.className = "savestate ok";
    } else if(ok === false){
      el.textContent = msg || "Not saved";
      el.className = "savestate";
      el.style.color = "var(--danger)";
    } else {
      el.textContent = msg || "Saving…";
      el.className = "savestate";
    }
  }

  function render(){
    renderSidebar();
    renderMain();
  }

  function renderSidebar(){
    const el = document.getElementById("sessList");
    el.innerHTML = "";
    Object.keys(state).forEach(id=>{
      const s = state[id];
      const hasData = Object.values(s.answers||{}).some(v=>v && v.trim()) || (s.demographics && s.demographics.age);
      const div = document.createElement("div");
      div.className = "sess-item" + (id===activeId ? " active" : "");
      div.innerHTML = `<span><span class="status-dot ${hasData?'has':''}"></span>${id}</span>`;
      div.onclick = () => { activeId = id; render(); };
      el.appendChild(div);
    });
  }

  function renderMain(){
    const main = document.getElementById("main");
    if(!activeId){ main.innerHTML = `<div class="card"><p class="muted">Select or add an interviewee on the left.</p></div>`; return; }
    const s = state[activeId];
    const d = s.demographics;

    const questionBlocks = QUESTIONS.map(q => `
      <div class="qblock" data-n="${q.n}">
        <span class="tag ${q.section}">${SECTION_LABEL[q.section]}</span>
        <div class="qnum">${q.n}. ${escapeHTML(q.text)}</div>
        <textarea data-answer="${q.n}" placeholder="Type the interviewee's answer...">${escapeHTML(s.answers[q.n]||"")}</textarea>
      </div>`).join("");

    main.innerHTML = `
      <div class="savebar">
        <h2 style="margin:0;">${activeId}</h2>
        <span class="savestate" id="saveState"></span>
      </div>

      <div class="card">
        <span class="tag demo">1. Demographics</span>
        <div class="grid2">
          <div class="field"><label>Age</label><input type="text" data-demo="age" value="${escapeAttr(d.age)}"></div>
          <div class="field"><label>Gender</label><input type="text" data-demo="gender" value="${escapeAttr(d.gender)}"></div>
          <div class="field"><label>Race</label><input type="text" data-demo="race" value="${escapeAttr(d.race)}"></div>
          <div class="field"><label>Profession</label><input type="text" data-demo="profession" value="${escapeAttr(d.profession)}"></div>
        </div>
        <div class="field"><label>Highest education status</label><input type="text" data-demo="education" value="${escapeAttr(d.education)}"></div>
      </div>

      <div class="card">
        ${questionBlocks}
      </div>

      <div class="footerbar">
        <button class="primary" id="exportJsonBtn">Export backup (.json — all interviewees)</button>
        <button id="importJsonBtn">Import backup (.json)</button>
        <button id="exportCsvBtn">Export demographics table (.csv)</button>
        <button id="exportTranscriptBtn">Export this interview (.md)</button>
      </div>
      <div id="exportPreview"></div>
    `;
    setSaveState(true);
    wireMain();
  }

  function wireMain(){
    document.querySelectorAll('[data-demo]').forEach(inp=>{
      inp.addEventListener('input', () => {
        state[activeId].demographics[inp.getAttribute('data-demo')] = inp.value;
        scheduleSave();
        renderSidebar();
      });
    });
    document.querySelectorAll('[data-answer]').forEach(ta=>{
      ta.addEventListener('input', () => {
        state[activeId].answers[ta.getAttribute('data-answer')] = ta.value;
        scheduleSave();
        renderSidebar();
      });
    });
    document.getElementById("exportJsonBtn").onclick = exportJSON;
    document.getElementById("importJsonBtn").onclick = () => document.getElementById("fileInput").click();
    document.getElementById("exportCsvBtn").onclick = exportCSV;
    document.getElementById("exportTranscriptBtn").onclick = exportTranscript;
  }

  function downloadBlob(filename, text, type){
    const blob = new Blob([text], {type: type || "text/plain"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }

  function exportJSON(){
    downloadBlob("hsg-interview-backup.json", JSON.stringify(state, null, 2), "application/json");
  }

  document.getElementById("fileInput").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const imported = JSON.parse(reader.result);
        Object.keys(imported).forEach(id => { state[id] = imported[id]; });
        persist();
        render();
        alert("Backup imported.");
      }catch(err){
        alert("That file didn't look like a valid backup.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  function csvEscape(v){
    const s = String(v==null ? "" : v);
    return '"' + s.replace(/"/g,'""') + '"';
  }

  function exportCSV(){
    const header = ["ID","Age","Gender","Race","Profession","Highest Education"];
    const rows = Object.keys(state).map(id=>{
      const d = state[id].demographics;
      return [id, d.age, d.gender, d.race, d.profession, d.education].map(csvEscape).join(",");
    });
    const csv = header.map(csvEscape).join(",") + "\n" + rows.join("\n") + "\n";
    downloadBlob("hsg-demographics.csv", csv, "text/csv");
  }

  function exportTranscript(){
    const s = state[activeId], d = s.demographics;
    let md = `# Interview ${activeId}\n\nAge ${d.age||"?"} | Gender ${d.gender||"?"} | Race ${d.race||"?"} | Profession ${d.profession||"?"} | Education ${d.education||"?"}\n\n`;
    QUESTIONS.forEach(q=>{
      md += `**${q.n}. [${SECTION_LABEL[q.section]}] ${q.text}**\n${s.answers[q.n]||"(no answer logged)"}\n\n`;
    });
    downloadBlob(`interview-${activeId}.md`, md, "text/markdown");
  }

  function escapeHTML(str){
    return String(str||"").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  }
  function escapeAttr(str){ return escapeHTML(str); }

  document.getElementById("addSessBtn").onclick = () => {
    const id = prompt("Interviewee ID (e.g. P6):");
    if(!id) return;
    const clean = id.trim().slice(0,20);
    if(!clean) return;
    if(!state[clean]) state[clean] = newSession();
    activeId = clean;
    persist();
    render();
  };

  window.addEventListener("beforeunload", () => { try{ persist(); }catch(e){} });

  loadState();
  activeId = IDS_DEFAULT[0];
  render();
})();
</script>
</body>
</html>
